%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/willsemi,wl2868c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Will Semiconductor WL2868C camera power management IC

maintainers:
  - Elden Mainline Agent <elden-mainline@localhost>

description:
  Seven programmable LDOs with separate inputs for LDO1/2, LDO3/4,
  LDO5, LDO6 and LDO7. LDO1/2 support 0.496 to 1.512 V and LDO3-7
  support 1.504 to 3.544 V, in 8 mV steps.

properties:
  compatible:
    const: willsemi,wl2868c

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active-low RST_N input.

  vin12-supply: true
  vin34-supply: true
  vin5-supply: true
  vin6-supply: true
  vin7-supply: true

  regulators:
    type: object
    additionalProperties: false
    patternProperties:
      "^ldo[1-7]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@2f {
            compatible = "willsemi,wl2868c";
            reg = <0x2f>;

            regulators {
                ldo1 {
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <1200000>;
                };
            };
        };
    };
