%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5kjns.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5KJNS image sensor

maintainers:
  - Elden Mainline Agent <elden-mainline@localhost>

description:
  The s5kjns is a raw image sensor with an MIPI CSI-2 image data
  interface and CCI (I2C compatible) control bus. The output format
  is raw Bayer.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5kjns

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: 19.2 MHz input clock.

  dovdd-supply: true

  avdd-supply: true

  dvdd-supply: true

  lens-focus: true

  flash-leds: true

  power-domains:
    maxItems: 1

  reset-gpios:
    description: Reference to the GPIO connected to the RESETB pin.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    description:
      Output port node, single endpoint describing the CSI-2 transmitter.

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies:
            items:
              - const: 672000000

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - dvdd-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@56 {
            compatible = "samsung,s5kjns";
            reg = <0x56>;

            clocks = <&s5kjns_clk>;

            reset-gpios = <&pio 19 GPIO_ACTIVE_LOW>;

            avdd-supply = <&s5kjns_avdd>;
            dovdd-supply = <&s5kjns_dovdd>;
            dvdd-supply = <&s5kjns_dvdd>;

            port {
                sensor_out: endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <672000000>;
                    remote-endpoint = <&seninf_csi_port_0_in>;
                };
            };
        };
    };

...
